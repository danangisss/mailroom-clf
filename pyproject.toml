[project]
name = "mailroom-clf"
version = "0.2.0"
description = "Classify scanned mail into branch, department, and recipient with a local vision model."
readme = "README.md"
authors = [
    { name = "nangdosan", email = "danangpostman37@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["mailroom", "classification", "document-ai", "streamlit", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.34.2",
    "streamlit>=1.66.0",
    "watchdog>=6.0.0",
]

[project.scripts]
mailroom-clf = "mailroom_clf.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
